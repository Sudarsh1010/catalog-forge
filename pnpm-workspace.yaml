packages:
  - "core/*"
  - "packages/*"
  - "platform/*"
  - "shared/*"
  - "services/*"
  - "tooling/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  lefthook: true
  msw: false

minimumReleaseAgeExclude:
  - vite@8.3.5
  - "@orpc/client@1.16.1"
  - "@orpc/contract@1.16.1"
  - "@orpc/interop@1.16.1"
  - "@orpc/server@1.16.1"
  - "@orpc/shared@1.16.1"
  - "@orpc/standard-server-aws-lambda@1.16.1"
  - "@orpc/standard-server-fastify@1.16.1"
  - "@orpc/standard-server-fetch@1.16.1"
  - "@orpc/standard-server-node@1.16.1"
  - "@orpc/standard-server-peer@1.16.1"
  - "@orpc/standard-server@1.16.1"
  - "@orpc/tanstack-query@1.16.1"
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - next@16.4.3
